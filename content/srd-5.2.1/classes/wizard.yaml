# yaml-language-server: $schema=../../../schemas/classes.schema.json
# SRD 5.2.1 — "Classes" > "Wizard". Level 1 traits are summarized; level 2+ feature text is
# the SRD's, generated from data/srd-5-2-1/classes.md; mechanics were added by hand.
id: wizard
name: Wizard
description: A scholarly magic-user who records spells in a spellbook and prepares them daily.
primary_abilities: [int]
hit_die: 6
complexity: Average
standard_array:
  str: 8
  dex: 12
  con: 13
  int: 15
  wis: 14
  cha: 10
subclass_level: 3
progression: {}
grants:
  saving_throws: [int, wis]
  weapon_proficiencies: [simple]
  choices:
  - id: skills
    label: Wizard skills
    kind: skill
    count: 2
    allowed: [arcana, history, insight, investigation, medicine, nature, religion]
  - id: equipment
    label: Wizard equipment
    kind: option
    step: equipment
    options:
    - id: a
      name: Package
      description: 2 Daggers, Arcane Focus (Quarterstaff), Robe, Spellbook, Scholar's Pack, 5 GP
      grants:
        items:
        - {item: dagger, qty: 2}
        - {item: quarterstaff}
        - {item: robe}
        - {item: spellbook}
        - {item: scholars-pack}
        gp: 5
    - id: b
      name: Gold
      description: 55 GP
      grants: {gp: 55}
multiclass: {}
features:
  '1':
    spellcasting: {list: wizard, ability: int, progression: full}
    traits:
    - name: Spellcasting
      text: Intelligence is your spellcasting ability. You can use an Arcane Focus or your spellbook as
        a Spellcasting Focus. After a Long Rest you can change your prepared spells (from your spellbook)
        and replace one cantrip.
    - name: Ritual Adept
      text: You can cast any Ritual spell in your spellbook as a Ritual without having it prepared, reading
        from the book.
    - name: Arcane Recovery
      text: Once per Long Rest, when you finish a Short Rest, recover expended spell slots with a combined
        level up to half your Wizard level, rounded up (one level 1 slot at level 1).
    choices:
    - id: cantrips
      label: Wizard cantrips
      kind: spell
      count: 3
      spell_level: 0
      spell_list: wizard
      hint: Light, Mage Hand, and Ray of Frost are recommended.
    - id: spellbook
      label: Spellbook
      kind: spell
      count: 6
      spell_level: 1
      spell_list: wizard
      hint: Detect Magic, Feather Fall, Mage Armor, Magic Missile, Sleep, and Thunderwave are recommended.
      tag: wizard-spellbook
    - id: prepared
      label: Wizard prepared spells
      kind: spell
      count: 4
      spell_level: 1
      subset_of: wizard-spellbook
      hint: Prepare four spells from your spellbook.
  '2':
    traits:
    - name: Scholar
      text: 'While studying magic, you also specialized in another field of study. Choose one of the following
        skills in which you have proficiency: Arcana, History, Investigation, Medicine, Nature, or Religion.
        You have Expertise in the chosen skill.'
    choices:
    - id: spellbook
      label: Spellbook (new spells)
      kind: spell
      count: 2
      max_spell_level: 1
      spell_list: wizard
      tag: wizard-spellbook
    - id: prepared
      label: Wizard prepared spells
      kind: spell
      count: 1
      max_spell_level: 1
      subset_of: wizard-spellbook
    - id: expertise
      label: Scholar Expertise
      kind: expertise
      count: 1
      allowed: [arcana, history, investigation, medicine, nature, religion]
  '3':
    traits:
    - name: Wizard Subclass
      text: |-
        You gain a Wizard subclass of your choice. The Evoker subclass is detailed after this class's description. A subclass is a specialization that grants you features at certain Wizard levels. For the rest of your career, you gain each of your subclass's features that are of your Wizard level or lower.

        > **Expanding and Replacing a Spellbook**
        >
        > The spells you add to your spellbook as you gain levels reflect your ongoing magical research, but you might find other spells during your adventures that you can add to the book. You could discover a Wizard spell on a _Spell Scroll_, for example, and then copy it into your spellbook.
        >
        > _Copying a Spell into the Book._ When you find a level 1+ Wizard spell, you can copy it into your spellbook if it's of a level you can prepare and if you have time to copy it. For each level of the spell, the transcription takes 2 hours and costs 50 GP. Afterward you can prepare the spell like the other spells in your spellbook.
        >
        > _Copying the Book._ You can copy a spell from your spellbook into another book. This is like copying a new spell into your spellbook but faster, since you already know how to cast the spell. You need spend only 1 hour and 10 GP for each level of the copied spell.
        >
        > If you lose your spellbook, you can use the same procedure to transcribe the Wizard spells that you have prepared into a new spellbook. Filling out the remainder of the new book requires you to find new spells to do so. For this reason, many wizards keep a backup spellbook.
    choices:
    - {id: subclass, label: Wizard subclass, kind: subclass}
    - id: spellbook
      label: Spellbook (new spells)
      kind: spell
      count: 2
      max_spell_level: 2
      spell_list: wizard
      tag: wizard-spellbook
    - id: prepared
      label: Wizard prepared spells
      kind: spell
      count: 1
      max_spell_level: 2
      subset_of: wizard-spellbook
