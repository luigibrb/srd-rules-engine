# yaml-language-server: $schema=../../../schemas/classes.schema.json
# SRD 5.2.1 — "Classes" > "Barbarian" (level 1 only).
id: barbarian
name: Barbarian
description: A fierce warrior who fights with primal rage and shrugs off blows.
primary_abilities: [str]
hit_die: 12
complexity: Average
standard_array: {str: 15, dex: 13, con: 14, int: 10, wis: 12, cha: 8}
grants:
  saving_throws: [str, con]
  weapon_proficiencies: [simple, martial]
  armor_training: [light, medium, shield]
  ac_calculations:
    - {name: Unarmored Defense, abilities: [dex, con], shield: true}
  traits:
    - name: Rage
      text: >-
        Bonus Action, not in Heavy armor. 2 uses; regain one on a Short Rest, all on a Long Rest.
        For up to 10 minutes: Resistance to Bludgeoning, Piercing and Slashing damage; +2 damage
        on attacks using Strength; Advantage on Strength checks and saves; no Concentration or
        spells. Extend it each turn by attacking, forcing a save, or taking a Bonus Action.
    - name: Unarmored Defense
      text: While you wear no armor, your base AC is 10 + Dex + Con. You can still use a Shield.
    - name: Weapon Mastery
      text: >-
        Use the mastery properties of two kinds of Simple or Martial Melee weapons. After a Long
        Rest you can swap one choice.
  choices:
    - id: skills
      label: Barbarian skills
      kind: skill
      count: 2
      allowed: [animal-handling, athletics, intimidation, nature, perception, survival]
    - id: weapon_mastery
      label: Weapon Mastery
      kind: weapon_mastery
      count: 2
      weapon_kind: melee
      hint: Greataxes and Handaxes come with your starting equipment.
    - id: equipment
      label: Barbarian equipment
      kind: option
      step: equipment
      options:
        - id: a
          name: Package
          description: Greataxe, 4 Handaxes, Explorer's Pack, 15 GP
          grants:
            items:
              - {item: greataxe}
              - {item: handaxe, qty: 4}
              - {item: explorers-pack}
            gp: 15
        - {id: b, name: Gold, description: 75 GP, grants: {gp: 75}}
