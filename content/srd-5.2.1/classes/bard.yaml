# yaml-language-server: $schema=../../../schemas/classes.schema.json
# SRD 5.2.1 — "Classes" > "Bard". Level 1 traits are summarized; level 2+ feature text is
# the SRD's, generated from data/srd-5-2-1/classes.md; mechanics were added by hand.
id: bard
name: Bard
description: A performer whose words and music weave magic that inspires allies.
primary_abilities: [cha]
hit_die: 8
complexity: High
standard_array:
  str: 8
  dex: 14
  con: 12
  int: 13
  wis: 10
  cha: 15
subclass_level: 3
progression:
  Bardic Die: [D6, D6, D6, D6, D8, D8, D8, D8, D8, D10, D10, D10, D10, D10, D12, D12, D12, D12, D12, D12]
grants:
  saving_throws: [dex, cha]
  weapon_proficiencies: [simple]
  armor_training: [light]
  choices:
  - {id: skills, label: Bard skills, kind: skill, count: 3}
  - id: instruments
    label: Bard musical instruments
    kind: tool
    count: 3
    category: musical-instrument
  - id: equipment
    label: Bard equipment
    kind: option
    step: equipment
    options:
    - id: a
      name: Package
      description: Leather Armor, 2 Daggers, Musical Instrument of your choice, Entertainer's Pack, 19
        GP
      grants:
        items:
        - {item: leather-armor}
        - {item: dagger, qty: 2}
        - {item: musical-instrument}
        - {item: entertainers-pack}
        gp: 19
    - id: b
      name: Gold
      description: 90 GP
      grants: {gp: 90}
multiclass:
  armor_training: [light]
  choices:
  - {id: skills, label: Bard multiclass skill, kind: skill}
  - {id: instruments, label: Bard multiclass musical instrument, kind: tool, category: musical-instrument}
features:
  '1':
    spellcasting: {list: bard, ability: cha, progression: full}
    traits:
    - name: Bardic Inspiration
      text: 'Bonus Action: give a creature within 60 ft that can see or hear you a d6. Within the next
        hour it can add the die to a D20 Test it failed. Uses equal your Charisma modifier (minimum 1);
        regain all on a Long Rest.'
    - name: Spellcasting
      text: Charisma is your spellcasting ability. You can use a Musical Instrument as a Spellcasting
        Focus. When you gain a Bard level you can replace one cantrip and one prepared spell.
    choices:
    - id: cantrips
      label: Bard cantrips
      kind: spell
      count: 2
      spell_level: 0
      spell_list: bard
      hint: Dancing Lights and Vicious Mockery are recommended.
      tag: bard-cantrips
      swap: class_level
    - id: prepared
      label: Bard prepared spells
      kind: spell
      count: 4
      spell_level: 1
      spell_list: bard
      hint: Charm Person, Color Spray, Dissonant Whispers, and Healing Word are recommended.
      tag: bard-prepared
      swap: class_level
    resources:
    - id: bardic-inspiration
      name: Bardic Inspiration
      max: {ability: cha, min: 1}
      recharge: long
  '2':
    traits:
    - name: Expertise
      text: |-
        You gain Expertise (see "Rules Glossary") in two of your skill proficiencies of your choice. Performance and Persuasion are recommended if you have proficiency in them.

        At Bard level 9, you gain Expertise in two more of your skill proficiencies of your choice.
    - name: Jack of All Trades
      text: |-
        You can add half your Proficiency Bonus (round down) to any ability check you make that uses a skill proficiency you lack and that doesn't otherwise use your Proficiency Bonus.

        For example, if you make a Strength (Athletics) check and lack Athletics proficiency, you can add half your Proficiency Bonus to the check.
    choices:
    - id: prepared
      label: Bard prepared spells
      kind: spell
      count: 1
      max_spell_level: 1
      spell_list: bard
      tag: bard-prepared
      swap: class_level
    - {id: expertise, label: Bard Expertise, kind: expertise, count: 2}
    effects:
    - {target: skill.unproficient, value: half_prof}
  '3':
    traits:
    - name: Bard Subclass
      text: You gain a Bard subclass of your choice. The College of Lore subclass is detailed after this
        class's description. A subclass is a specialization that grants you features at certain Bard levels.
        For the rest of your career, you gain each of your subclass's features that are of your Bard level
        or lower.
    choices:
    - {id: subclass, label: Bard subclass, kind: subclass}
    - id: prepared
      label: Bard prepared spells
      kind: spell
      count: 1
      max_spell_level: 2
      spell_list: bard
      tag: bard-prepared
      swap: class_level
  '4':
    traits:
    - name: Ability Score Improvement
      text: You gain the Ability Score Improvement feat (see "Feats") or another feat of your choice for
        which you qualify. You gain this feature again at Bard levels 8, 12, and 16.
    choices:
    - id: feat
      label: Ability Score Improvement or feat
      kind: feat
      hint: The Ability Score Improvement feat, or another feat you qualify for.
    - id: cantrips
      label: Bard cantrips
      kind: spell
      count: 1
      spell_level: 0
      spell_list: bard
      tag: bard-cantrips
      swap: class_level
    - id: prepared
      label: Bard prepared spells
      kind: spell
      count: 1
      max_spell_level: 2
      spell_list: bard
      tag: bard-prepared
      swap: class_level
  '5':
    traits:
    - name: Font of Inspiration
      text: |-
        You now regain all your expended uses of Bardic Inspiration when you finish a Short or Long Rest.

        In addition, you can expend a spell slot (no action required) to regain one expended use of Bardic Inspiration.
    choices:
    - id: prepared
      label: Bard prepared spells
      kind: spell
      count: 2
      max_spell_level: 3
      spell_list: bard
      tag: bard-prepared
      swap: class_level
    resources:
    - id: bardic-inspiration
      name: Bardic Inspiration
      max: {ability: cha, min: 1}
      recharge: short
  '6':
    choices:
    - id: prepared
      label: Bard prepared spells
      kind: spell
      count: 1
      max_spell_level: 3
      spell_list: bard
      tag: bard-prepared
      swap: class_level
  '7':
    traits:
    - name: Countercharm
      text: You can use musical notes or words of power to disrupt mind-influencing effects. If you or
        a creature within 30 feet of you fails a saving throw against an effect that applies the Charmed
        or Frightened condition, you can take a Reaction to cause the save to be rerolled, and the new
        roll has Advantage.
    choices:
    - id: prepared
      label: Bard prepared spells
      kind: spell
      count: 1
      max_spell_level: 4
      spell_list: bard
      tag: bard-prepared
      swap: class_level
  '8':
    choices:
    - id: feat
      label: Ability Score Improvement or feat
      kind: feat
      hint: The Ability Score Improvement feat, or another feat you qualify for.
    - id: prepared
      label: Bard prepared spells
      kind: spell
      count: 1
      max_spell_level: 4
      spell_list: bard
      tag: bard-prepared
      swap: class_level
  '9':
    choices:
    - id: prepared
      label: Bard prepared spells
      kind: spell
      count: 2
      max_spell_level: 5
      spell_list: bard
      tag: bard-prepared
      swap: class_level
    - {id: expertise, label: Bard Expertise, kind: expertise, count: 2}
  '10':
    traits:
    - name: Magical Secrets
      text: You've learned secrets from various magical traditions. Whenever you reach a Bard level (including
        this level) and the Prepared Spells number in the Bard Features table increases, you can choose
        any of your new prepared spells from the Bard, Cleric, Druid, and Wizard spell lists, and the
        chosen spells count as Bard spells for you (see a class's section for its spell list). In addition,
        whenever you replace a spell prepared for this class, you can replace it with a spell from those
        lists.
    choices:
    - id: cantrips
      label: Bard cantrips
      kind: spell
      count: 1
      spell_level: 0
      spell_list: bard
      tag: bard-cantrips
      swap: class_level
    - id: prepared
      label: Bard prepared spells
      kind: spell
      count: 1
      max_spell_level: 5
      spell_list: [bard, cleric, druid, wizard]
      hint: 'Magical Secrets: from the Bard, Cleric, Druid, or Wizard list.'
      tag: bard-prepared
      swap: class_level
  '11':
    choices:
    - id: prepared
      label: Bard prepared spells
      kind: spell
      count: 1
      max_spell_level: 6
      spell_list: [bard, cleric, druid, wizard]
      hint: 'Magical Secrets: from the Bard, Cleric, Druid, or Wizard list.'
      tag: bard-prepared
      swap: class_level
  '12':
    choices:
    - id: feat
      label: Ability Score Improvement or feat
      kind: feat
      hint: The Ability Score Improvement feat, or another feat you qualify for.
  '13':
    choices:
    - id: prepared
      label: Bard prepared spells
      kind: spell
      count: 1
      max_spell_level: 7
      spell_list: [bard, cleric, druid, wizard]
      hint: 'Magical Secrets: from the Bard, Cleric, Druid, or Wizard list.'
      tag: bard-prepared
      swap: class_level
  '15':
    choices:
    - id: prepared
      label: Bard prepared spells
      kind: spell
      count: 1
      max_spell_level: 8
      spell_list: [bard, cleric, druid, wizard]
      hint: 'Magical Secrets: from the Bard, Cleric, Druid, or Wizard list.'
      tag: bard-prepared
      swap: class_level
  '16':
    choices:
    - id: feat
      label: Ability Score Improvement or feat
      kind: feat
      hint: The Ability Score Improvement feat, or another feat you qualify for.
  '17':
    choices:
    - id: prepared
      label: Bard prepared spells
      kind: spell
      count: 1
      max_spell_level: 9
      spell_list: [bard, cleric, druid, wizard]
      hint: 'Magical Secrets: from the Bard, Cleric, Druid, or Wizard list.'
      tag: bard-prepared
      swap: class_level
  '18':
    traits:
    - name: Superior Inspiration
      text: When you roll Initiative, you regain expended uses of Bardic Inspiration until you have two
        if you have fewer than that.
    choices:
    - id: prepared
      label: Bard prepared spells
      kind: spell
      count: 1
      max_spell_level: 9
      spell_list: [bard, cleric, druid, wizard]
      hint: 'Magical Secrets: from the Bard, Cleric, Druid, or Wizard list.'
      tag: bard-prepared
      swap: class_level
  '19':
    traits:
    - name: Epic Boon
      text: You gain an Epic Boon feat (see "Feats") or another feat of your choice for which you qualify.
        Boon of Spell Recall is recommended.
    choices:
    - id: feat
      label: Epic Boon or feat
      kind: feat
      category: [epic_boon, general, origin, fighting_style]
      hint: An Epic Boon feat, or another feat you qualify for.
    - id: prepared
      label: Bard prepared spells
      kind: spell
      count: 1
      max_spell_level: 9
      spell_list: [bard, cleric, druid, wizard]
      hint: 'Magical Secrets: from the Bard, Cleric, Druid, or Wizard list.'
      tag: bard-prepared
      swap: class_level
  '20':
    traits:
    - name: Words of Creation
      text: 'You have mastered two of the Words of Creation: the words of life and death. You therefore
        always have the _Power Word Heal_ and _Power Word Kill_ spells prepared. When you cast either
        spell, you can target a second creature with it if that creature is within 10 feet of the first
        target.'
    choices:
    - id: prepared
      label: Bard prepared spells
      kind: spell
      count: 1
      max_spell_level: 9
      spell_list: [bard, cleric, druid, wizard]
      hint: 'Magical Secrets: from the Bard, Cleric, Druid, or Wizard list.'
      tag: bard-prepared
      swap: class_level
    spells: [power-word-heal, power-word-kill]
