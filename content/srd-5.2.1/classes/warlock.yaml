  '19':
    traits:
    - name: Epic Boon
      text: You gain an Epic Boon feat (see "Feats") or another feat of your choice for which you qualify.
        Boon of Fate is recommended.
    choices:
    - id: feat
      label: Epic Boon or feat
      kind: feat
