# yaml-language-server: $schema=../../../schemas/classes.schema.json
# SRD 5.2.1 — "Classes" > "Warlock". Level 1 traits are summarized; level 2+ feature text is
# the SRD's, generated from data/srd-5-2-1/classes.md; mechanics were added by hand.
id: warlock
name: Warlock
description: An occultist who wields magic granted by a pact with an otherworldly patron.
primary_abilities: [cha]
hit_die: 8
complexity: High
standard_array:
  str: 8
  dex: 14
  con: 13
  int: 12
  wis: 10
  cha: 15
subclass_level: 3
progression:
  Eldritch Invocations: [1, 3, 3, 3, 5, 5, 6, 6, 7, 7, 7, 8, 8, 8, 9, 9, 9, 10, 10, 10]
grants:
  saving_throws: [wis, cha]
  weapon_proficiencies: [simple]
  armor_training: [light]
  choices:
  - id: skills
    label: Warlock skills
    kind: skill
    count: 2
    allowed: [arcana, deception, history, intimidation, investigation, nature, religion]
  - id: equipment
    label: Warlock equipment
    kind: option
    step: equipment
    options:
    - id: a
      name: Package
      description: Leather Armor, Sickle, 2 Daggers, Arcane Focus (orb), Book (occult lore), Scholar's
        Pack, 15 GP
      grants:
        items:
        - {item: leather-armor}
        - {item: sickle}
        - {item: dagger, qty: 2}
        - {item: arcane-focus-orb}
        - {item: book-occult-lore}
        - {item: scholars-pack}
        gp: 15
    - id: b
      name: Gold
      description: 100 GP
      grants: {gp: 100}
multiclass:
  armor_training: [light]
features:
  '1':
    spellcasting:
      list: warlock
      ability: cha
      progression: pact
      pact_slots:
      - {count: 1, level: 1}
      - {count: 2, level: 1}
      - {count: 2, level: 2}
      - {count: 2, level: 2}
      - {count: 2, level: 3}
      - {count: 2, level: 3}
      - {count: 2, level: 4}
      - {count: 2, level: 4}
      - {count: 2, level: 5}
      - {count: 2, level: 5}
      - {count: 3, level: 5}
      - {count: 3, level: 5}
      - {count: 3, level: 5}
      - {count: 3, level: 5}
      - {count: 3, level: 5}
      - {count: 3, level: 5}
      - {count: 4, level: 5}
      - {count: 4, level: 5}
      - {count: 4, level: 5}
      - {count: 4, level: 5}
    traits:
    - name: Pact Magic
      text: Charisma is your spellcasting ability. You can use an Arcane Focus as a Spellcasting Focus.
        Your Pact Magic slots come back when you finish a Short or Long Rest.
    choices:
    - id: cantrips
      label: Warlock cantrips
      kind: spell
      count: 2
      spell_level: 0
      spell_list: warlock
      hint: Eldritch Blast and Prestidigitation are recommended.
      tag: warlock-cantrips
      swap: class_level
    - id: invocation
      label: Eldritch Invocation
      kind: feature
      category: eldritch_invocation
      hint: Pact of the Tome is recommended.
      tag: warlock-invocations
      swap: class_level
    - id: prepared
      label: Warlock prepared spells
      kind: spell
      count: 2
      spell_level: 1
      spell_list: warlock
      hint: Charm Person and Hex are recommended.
      tag: warlock-prepared
      swap: class_level
  '2':
    traits:
    - name: Magical Cunning
      text: You can perform an esoteric rite for 1 minute. At the end of it, you regain expended Pact
        Magic spell slots but no more than a number equal to half your maximum (round up). Once you use
        this feature, you can't do so again until you finish a Long Rest.
    choices:
    - id: prepared
      label: Warlock prepared spells
      kind: spell
      count: 1
      max_spell_level: 1
      spell_list: warlock
      tag: warlock-prepared
      swap: class_level
    - id: invocations
      label: Eldritch Invocations
      kind: feature
      category: eldritch_invocation
      count: 2
      tag: warlock-invocations
      swap: class_level
  '3':
    traits:
    - name: Warlock Subclass
      text: You gain a Warlock subclass of your choice. The Fiend Patron subclass is detailed after this
        class's description. A subclass is a specialization that grants you features at certain Warlock
        levels. For the rest of your career, you gain each of your subclass's features that are of your
        Warlock level or lower.
    choices:
    - {id: subclass, label: Warlock subclass, kind: subclass}
    - id: prepared
      label: Warlock prepared spells
      kind: spell
      count: 1
      max_spell_level: 2
      spell_list: warlock
      tag: warlock-prepared
      swap: class_level
  '4':
    traits:
    - name: Ability Score Improvement
      text: You gain the Ability Score Improvement feat (see "Feats") or another feat of your choice for
        which you qualify. You gain this feature again at Warlock levels 8, 12, and 16.
    choices:
    - id: feat
      label: Ability Score Improvement or feat
      kind: feat
      hint: The Ability Score Improvement feat, or another feat you qualify for.
    - id: cantrips
      label: Warlock cantrips
      kind: spell
      count: 1
      spell_level: 0
      spell_list: warlock
      tag: warlock-cantrips
      swap: class_level
    - id: prepared
      label: Warlock prepared spells
      kind: spell
      count: 1
      max_spell_level: 2
      spell_list: warlock
      tag: warlock-prepared
      swap: class_level
  '5':
    choices:
    - id: prepared
      label: Warlock prepared spells
      kind: spell
      count: 1
      max_spell_level: 3
      spell_list: warlock
      tag: warlock-prepared
      swap: class_level
    - id: invocations
      label: Eldritch Invocations
      kind: feature
      category: eldritch_invocation
      count: 2
      tag: warlock-invocations
      swap: class_level
  '6':
    choices:
    - id: prepared
      label: Warlock prepared spells
      kind: spell
      count: 1
      max_spell_level: 3
      spell_list: warlock
      tag: warlock-prepared
      swap: class_level
  '7':
    choices:
    - id: prepared
      label: Warlock prepared spells
      kind: spell
      count: 1
      max_spell_level: 4
      spell_list: warlock
      tag: warlock-prepared
      swap: class_level
    - id: invocations
      label: Eldritch Invocations
      kind: feature
      category: eldritch_invocation
      count: 1
      tag: warlock-invocations
      swap: class_level
  '8':
    choices:
    - id: feat
      label: Ability Score Improvement or feat
      kind: feat
      hint: The Ability Score Improvement feat, or another feat you qualify for.
    - id: prepared
      label: Warlock prepared spells
      kind: spell
      count: 1
      max_spell_level: 4
      spell_list: warlock
      tag: warlock-prepared
      swap: class_level
  '9':
    traits:
    - name: Contact Patron
      text: |-
        In the past, you usually contacted your patron through intermediaries. Now you can communicate directly; you always have the _Contact Other Plane_ spell prepared. With this feature, you can cast the spell without expending a spell slot to contact your patron, and you automatically succeed on the spell's saving throw.

        Once you cast the spell with this feature, you can't do so in this way again until you finish a Long Rest.
    choices:
    - id: prepared
      label: Warlock prepared spells
      kind: spell
      count: 1
      max_spell_level: 5
      spell_list: warlock
      tag: warlock-prepared
      swap: class_level
    - id: invocations
      label: Eldritch Invocations
      kind: feature
      category: eldritch_invocation
      count: 1
      tag: warlock-invocations
      swap: class_level
    spells: [contact-other-plane]
  '10':
    choices:
    - id: cantrips
      label: Warlock cantrips
      kind: spell
      count: 1
      spell_level: 0
      spell_list: warlock
      tag: warlock-cantrips
      swap: class_level
  '11':
    traits:
    - name: Mystic Arcanum
      text: |-
        Your patron grants you a magical secret called an arcanum. Choose one level 6 Warlock spell as this arcanum.

        You can cast your arcanum spell once without expending a spell slot, and you must finish a Long Rest before you can cast it in this way again.

        As shown in the Warlock Features table, you gain another Warlock spell of your choice that can be cast in this way when you reach Warlock levels 13 (level 7 spell), 15 (level 8 spell), and 17 (level 9 spell). You regain all uses of your Mystic Arcanum when you finish a Long Rest.

        Whenever you gain a Warlock level, you can replace one of your arcanum spells with another Warlock spell of the same level.
    choices:
    - id: prepared
      label: Warlock prepared spells
      kind: spell
      count: 1
      max_spell_level: 5
      spell_list: warlock
      tag: warlock-prepared
      swap: class_level
    - id: mystic_arcanum
      label: Mystic Arcanum (level 6 spell)
      kind: spell
      spell_level: 6
      spell_list: warlock
      always_prepared: true
      tag: warlock-arcanum
      swap: class_level
      same_level: true
  '12':
    choices:
    - id: feat
      label: Ability Score Improvement or feat
      kind: feat
      hint: The Ability Score Improvement feat, or another feat you qualify for.
    - id: invocations
      label: Eldritch Invocations
      kind: feature
      category: eldritch_invocation
      count: 1
      tag: warlock-invocations
      swap: class_level
  '13':
