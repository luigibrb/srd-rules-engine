# yaml-language-server: $schema=../../../schemas/classes.schema.json
# SRD 5.2.1 — "Classes" > "Druid". Level 1 traits are summarized; level 2+ feature text is
# the SRD's, generated from data/srd-5-2-1/classes.md; mechanics were added by hand.
id: druid
name: Druid
description: A priest of the Old Faith who draws magic from nature and the wild.
primary_abilities: [wis]
hit_die: 8
complexity: High
standard_array:
  str: 8
  dex: 12
  con: 14
  int: 13
  wis: 15
  cha: 10
subclass_level: 3
progression:
  Wild Shape: [—, 2, 2, 2, 2, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 4, 4, 4, 4]
grants:
  saving_throws: [int, wis]
  weapon_proficiencies: [simple]
  armor_training: [light, shield]
  tools: [herbalism-kit]
  choices:
  - id: skills
    label: Druid skills
    kind: skill
    count: 2
    allowed: [animal-handling, arcana, insight, medicine, nature, perception, religion, survival]
  - id: equipment
    label: Druid equipment
    kind: option
    step: equipment
    options:
    - id: a
      name: Package
      description: Leather Armor, Shield, Sickle, Druidic Focus (Quarterstaff), Explorer's Pack, Herbalism
        Kit, 9 GP
      grants:
        items:
        - {item: leather-armor}
        - {item: shield}
        - {item: sickle}
        - {item: quarterstaff}
        - {item: explorers-pack}
        - {item: herbalism-kit}
        gp: 9
    - id: b
      name: Gold
      description: 50 GP
      grants: {gp: 50}
multiclass:
  armor_training: [light, shield]
features:
  '1':
    languages: [druidic]
    spells: [speak-with-animals]
    spellcasting: {list: druid, ability: wis, progression: full}
    traits:
    - name: Druidic
      text: You know Druidic, the secret language of Druids, and always have Speak with Animals prepared.
        Others need a DC 15 Intelligence (Investigation) check to spot your hidden messages and magic
        to read them.
    - name: Spellcasting
      text: Wisdom is your spellcasting ability. You can use a Druidic Focus as a Spellcasting Focus.
        After a Long Rest you can change your prepared spells.
    choices:
    - id: primal_order
      label: Primal Order
      kind: option
      step: features
      options:
      - id: magician
        name: Magician
        description: One extra Druid cantrip, and a bonus equal to your Wisdom modifier (minimum +1) to
          Intelligence (Arcana or Nature) checks.
        grants:
          effects:
          - {target: skill.arcana, value: wis, min: 1}
          - {target: skill.nature, value: wis, min: 1}
          choices:
          - id: cantrip
            label: Magician cantrip
            kind: spell
            spell_level: 0
            spell_list: druid
      - id: warden
        name: Warden
        description: Trained for battle, you gain proficiency with Martial weapons and training with Medium
          armor.
        grants:
          weapon_proficiencies: [martial]
          armor_training: [medium]
    - id: cantrips
      label: Druid cantrips
      kind: spell
      count: 2
      spell_level: 0
      spell_list: druid
      hint: Druidcraft and Produce Flame are recommended.
    - id: prepared
      label: Druid prepared spells
      kind: spell
      count: 4
      spell_level: 1
      spell_list: druid
      hint: Animal Friendship, Cure Wounds, Faerie Fire, and Thunderwave are recommended.
  '2':
    traits:
    - name: Wild Shape
      text: |-
        The power of nature allows you to assume the form of an animal. As a Bonus Action, you shape-shift into a Beast form that you have learned for this feature (see "Known Forms" below). You stay in that form for a number of hours equal to half your Druid level or until you use Wild Shape again, have the Incapacitated condition, or die. You can also leave the form early as a Bonus Action.

        _Number of Uses._ You can use Wild Shape twice. You regain one expended use when you finish a Short Rest, and you regain all expended uses when you finish a Long Rest.

        You gain additional uses when you reach certain Druid levels, as shown in the Wild Shape column of the Druid Features table.

        _Known Forms._ You know four Beast forms for this feature, chosen from among Beast stat blocks that have a maximum Challenge Rating of 1/4 and that lack a Fly Speed (see "Animals" in "Monsters" for stat block options). The **Rat**, **Riding Horse**, **Spider**, and **Wolf** are recommended. Whenever you finish a Long Rest, you can replace one of your known forms with another eligible form.

        When you reach certain Druid levels, your number of known forms and the maximum Challenge Rating for those forms increases, as shown in the Beast Shapes table. In addition, starting at level 8, you can adopt a form that has a Fly Speed.

        When choosing known forms, you may look in other sources for eligible Beasts if the Game Master permits you to do so.

        **Beast Shapes**

        <table>
          <thead>
            <tr>
              <th>Druid Level</th>
              <th>Known Forms</th>
              <th>Max CR</th>
              <th>Fly Speed</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>2</td>
              <td>4</td>
              <td>1/4</td>
              <td>No</td>
            </tr>
            <tr>
              <td>4</td>
              <td>6</td>
              <td>1/2</td>
              <td>No</td>
            </tr>
            <tr>
              <td>8</td>
              <td>8</td>
              <td>1</td>
              <td>Yes</td>
            </tr>
          </tbody>
        </table>

        **Rules While Shape-Shifted.** While in a form, you retain your personality, memories, and ability to speak, and the following rules apply:

        **Temporary Hit Points.** When you assume a Wild Shape form, you gain a number of Temporary Hit Points equal to your Druid level.

        **Game Statistics.** Your game statistics are replaced by the Beast's stat block, but you retain your creature type; Hit Points; Hit Point Dice; Intelligence, Wisdom, and Charisma scores; class features; languages; and feats. You also retain your skill and saving throw proficiencies and use your Proficiency Bonus for them, in addition to gaining the proficiencies of the creature. If a skill or saving throw modifier in the Beast's stat block is higher than yours, use the one in the stat block.

        **No Spellcasting.** You can't cast spells, but shapeshifting doesn't break your Concentration or otherwise interfere with a spell you've already cast.

        **Objects.** Your ability to handle objects is determined by the form's limbs rather than your own. In addition, you choose whether your equipment falls in your space, merges into your new form, or is worn by it. Worn equipment functions as normal, but the GM decides whether it's practical for the new form to wear a piece of equipment based on the creature's size and shape. Your equipment doesn't change size or shape to match the new form, and any equipment that the new form can't wear must either fall to the ground or merge with the form. Equipment that merges with the form has no effect while you're in that form.
    - name: Wild Companion
      text: |-
        You can summon a nature spirit that assumes an animal form to aid you. As a Magic action, you can expend a spell slot or a use of Wild Shape to cast the _Find Familiar_ spell without Material components.

        When you cast the spell in this way, the familiar is Fey and disappears when you finish a Long Rest.
    choices:
    - id: prepared
      label: Druid prepared spells
      kind: spell
      count: 1
      max_spell_level: 1
      spell_list: druid
  '3':
    traits:
    - name: Druid Subclass
      text: You gain a Druid subclass of your choice. The Circle of the Land subclass is detailed after
        this class's description. A subclass is a specialization that grants you features at certain Druid
        levels. For the rest of your career, you gain each of your subclass's features that are of your
        Druid level or lower.
    choices:
    - {id: subclass, label: Druid subclass, kind: subclass}
    - id: prepared
      label: Druid prepared spells
      kind: spell
      count: 1
      max_spell_level: 2
      spell_list: druid
  '4':
    traits:
    - name: Ability Score Improvement
      text: You gain the Ability Score Improvement feat (see "Feats") or another feat of your choice for
        which you qualify. You gain this feature again at Druid levels 8, 12, and 16.
    choices:
    - id: feat
      label: Ability Score Improvement or feat
      kind: feat
      hint: The Ability Score Improvement feat, or another feat you qualify for.
    - id: cantrips
      label: Druid cantrips
      kind: spell
      count: 1
      spell_level: 0
      spell_list: druid
    - id: prepared
      label: Druid prepared spells
      kind: spell
      count: 1
      max_spell_level: 2
      spell_list: druid
  '5':
    traits:
    - name: Wild Resurgence
      text: |-
        Once on each of your turns, if you have no uses of Wild Shape left, you can give yourself one use by expending a spell slot (no action required).

        In addition, you can expend one use of Wild Shape (no action required) to give yourself a level 1 spell slot, but you can't do so again until you finish a Long Rest.
    choices:
    - id: prepared
      label: Druid prepared spells
      kind: spell
      count: 2
      max_spell_level: 3
      spell_list: druid
  '6':
    choices:
    - id: prepared
      label: Druid prepared spells
      kind: spell
      count: 1
      max_spell_level: 3
      spell_list: druid
  '7':
    traits:
    - name: Elemental Fury
      text: |-
        The might of the elements flows through you. You gain one of the following options of your choice.

        _Potent Spellcasting._ Add your Wisdom modifier to the damage you deal with any Druid cantrip.

        _Primal Strike._ Once on each of your turns when you hit a creature with an attack roll using a weapon or a Beast form's attack in Wild Shape, you can cause the target to take an extra 1d8 Cold, Fire, Lightning, or Thunder damage (choose when you hit).
    choices:
    - id: prepared
      label: Druid prepared spells
      kind: spell
      count: 1
      max_spell_level: 4
      spell_list: druid
    - id: elemental_fury
      label: Elemental Fury
      kind: option
      options:
      - id: potent-spellcasting
        name: Potent Spellcasting
        description: Add your Wisdom modifier to the damage of your Druid cantrips.
      - id: primal-strike
        name: Primal Strike
        description: Once per turn, a weapon or Beast-form hit deals an extra 1d8 Cold, Fire, Lightning,
          or Thunder damage.
  '8':
    choices:
    - id: feat
      label: Ability Score Improvement or feat
      kind: feat
      hint: The Ability Score Improvement feat, or another feat you qualify for.
    - id: prepared
      label: Druid prepared spells
      kind: spell
      count: 1
      max_spell_level: 4
      spell_list: druid
  '9':
    choices:
    - id: prepared
      label: Druid prepared spells
      kind: spell
      count: 2
      max_spell_level: 5
      spell_list: druid
  '10':
    choices:
    - id: cantrips
      label: Druid cantrips
      kind: spell
      count: 1
      spell_level: 0
      spell_list: druid
    - id: prepared
      label: Druid prepared spells
      kind: spell
      count: 1
      max_spell_level: 5
      spell_list: druid
  '11':
    choices:
    - id: prepared
      label: Druid prepared spells
      kind: spell
      count: 1
      max_spell_level: 6
      spell_list: druid
  '12':
    choices:
    - id: feat
      label: Ability Score Improvement or feat
      kind: feat
      hint: The Ability Score Improvement feat, or another feat you qualify for.
  '13':
    choices:
    - id: prepared
      label: Druid prepared spells
      kind: spell
      count: 1
      max_spell_level: 7
      spell_list: druid
  '15':
    traits:
    - name: Improved Elemental Fury
      text: |-
        The option you chose for Elemental Fury grows more powerful, as detailed below.

        _Potent Spellcasting._ When you cast a Druid cantrip with a range of 10 feet or greater, the spell's range increases by 300 feet.

        _Primal Strike._ The extra damage of your Primal Strike increases to 2d8.
    choices:
    - id: prepared
      label: Druid prepared spells
