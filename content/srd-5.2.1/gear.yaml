# yaml-language-server: $schema=../../schemas/gear.schema.json
# SRD 5.2.1 — "Equipment" > "Adventuring Gear" (only items referenced by starting equipment so far).
# Items marked "of your choice" stand in for a pick the builder doesn't automate (like shopping).
- {id: arrow, name: Arrow}
- {id: book-history, name: Book (history)}
- {id: book-prayers, name: Book (prayers)}
- {id: crowbar, name: Crowbar}
- id: dungeoneers-pack
  name: "Dungeoneer's Pack"
  description: >-
    Backpack, Caltrops, Crowbar, 2 flasks of Oil, 10 days of Rations, Rope, Tinderbox,
    10 Torches, and Waterskin.
- {id: gaming-set, name: Gaming Set (same as your tool proficiency)}
- {id: healers-kit, name: "Healer's Kit"}
- {id: holy-symbol, name: Holy Symbol}
- {id: parchment, name: Parchment (sheet)}
- {id: pouch, name: Pouch}
- {id: quiver, name: Quiver}
- {id: robe, name: Robe}
- {id: travelers-clothes, name: "Traveler's Clothes"}
- {id: arcane-focus-crystal, name: Arcane Focus (crystal)}
- {id: arcane-focus-orb, name: Arcane Focus (orb)}
- {id: artisans-tools-or-instrument, name: "Artisan's Tools or Musical Instrument (same as your tool proficiency)"}
- {id: book-occult-lore, name: Book (occult lore)}
- id: burglars-pack
  name: "Burglar's Pack"
  description: >-
    Backpack, Ball Bearings, Bell, 10 Candles, Crowbar, Hooded Lantern, 7 flasks of Oil, 5 days
    of Rations, Rope, Tinderbox, and Waterskin.
- {id: druidic-focus-mistletoe, name: Druidic Focus (sprig of mistletoe)}
- id: entertainers-pack
  name: "Entertainer's Pack"
  description: >-
    Backpack, Bedroll, Bell, Bullseye Lantern, 3 Costumes, Mirror, 8 flasks of Oil, 9 days of
    Rations, Tinderbox, and Waterskin.
- id: explorers-pack
  name: "Explorer's Pack"
  description: >-
    Backpack, Bedroll, 2 flasks of Oil, 10 days of Rations, Rope, Tinderbox, 10 Torches, and
    Waterskin.
- {id: musical-instrument, name: Musical Instrument (of your choice)}
- id: priests-pack
  name: "Priest's Pack"
  description: Backpack, Blanket, Holy Water, Lamp, 7 days of Rations, Robe, and Tinderbox.
- id: scholars-pack
  name: "Scholar's Pack"
  description: >-
    Backpack, Book, Ink, Ink Pen, Lamp, 10 flasks of Oil, 10 sheets of Parchment, and Tinderbox.
- {id: spellbook, name: Spellbook, description: "Holds a Wizard's level 1+ spells; 100 pages."}
