# yaml-language-server: $schema=../../schemas/gear.schema.json
# SRD 5.2.1 — "Equipment" > "Adventuring Gear", generated by scripts/import-srd-gear.ts (prices,
# weights, text); entries it doesn't list are kept. Items marked "of your choice" stand in for a
# pick the builder doesn't automate.
- id: arrow
  name: Arrow
  cost: 1 GP
  weight: 1 lb.
  bundle: 20
- id: book-history
  name: Book (history)
  cost: 25 GP
  weight: 5 lb.
- id: book-prayers
  name: Book (prayers)
  cost: 25 GP
  weight: 5 lb.
- id: crowbar
  name: Crowbar
  cost: 2 GP
  weight: 5 lb.
  description: Using a Crowbar gives you Advantage on Strength checks where the Crowbar's leverage can
    be applied.
- id: dungeoneers-pack
  name: Dungeoneer's Pack
  description: Backpack, Caltrops, Crowbar, 2 flasks of Oil, 10 days of Rations, Rope, Tinderbox, 10
    Torches, and Waterskin.
  cost: 12 GP
  weight: 55 lb.
- id: gaming-set
  name: Gaming Set (same as your tool proficiency)
- id: healers-kit
  name: Healer's Kit
  cost: 5 GP
  weight: 3 lb.
  description: A Healer's Kit has ten uses. As a Utilize action, you can expend one of its uses to
    stabilize an Unconscious creature that has 0 Hit Points without needing to make a Wisdom
    (Medicine) check.
- id: holy-symbol
  name: Holy Symbol
  cost: 5 GP
  weight: 1 lb.
- id: parchment
  name: Parchment (sheet)
  cost: 1 SP
  description: One sheet of Parchment can hold about 250 handwritten words.
- id: pouch
  name: Pouch
  cost: 5 SP
  weight: 1 lb.
  description: A Pouch holds up to 6 pounds within one-fifth of a cubic foot.
- id: quiver
  name: Quiver
  cost: 1 GP
  weight: 1 lb.
  description: A Quiver holds up to 20 Arrows.
- id: robe
  name: Robe
  cost: 1 GP
  weight: 4 lb.
  description: A Robe has vocational or ceremonial significance. Some events and locations admit only
    people wearing a Robe bearing certain colors or symbols.
- id: travelers-clothes
  name: Traveler's Clothes
  cost: 2 GP
  weight: 4 lb.
  description: Traveler's Clothes are resilient garments designed for travel in various environments.
- id: arcane-focus-crystal
  name: Arcane Focus (crystal)
  cost: 10 GP
  weight: 1 lb.
- id: arcane-focus-orb
  name: Arcane Focus (orb)
  cost: 20 GP
  weight: 3 lb.
- id: artisans-tools-or-instrument
  name: Artisan's Tools or Musical Instrument (same as your tool proficiency)
- id: book-occult-lore
  name: Book (occult lore)
  cost: 25 GP
  weight: 5 lb.
- id: burglars-pack
  name: Burglar's Pack
  description: Backpack, Ball Bearings, Bell, 10 Candles, Crowbar, Hooded Lantern, 7 flasks of Oil, 5
    days of Rations, Rope, Tinderbox, and Waterskin.
  cost: 16 GP
  weight: 42 lb.
- id: druidic-focus-mistletoe
  name: Druidic Focus (sprig of mistletoe)
  cost: 1 GP
- id: entertainers-pack
  name: Entertainer's Pack
  description: Backpack, Bedroll, Bell, Bullseye Lantern, 3 Costumes, Mirror, 8 flasks of Oil, 9 days
    of Rations, Tinderbox, and Waterskin.
  cost: 40 GP
  weight: 58½ lb.
- id: explorers-pack
  name: Explorer's Pack
  description: Backpack, Bedroll, 2 flasks of Oil, 10 days of Rations, Rope, Tinderbox, 10 Torches,
    and Waterskin.
  cost: 10 GP
  weight: 55 lb.
- id: musical-instrument
  name: Musical Instrument (of your choice)
- id: priests-pack
  name: Priest's Pack
  description: Backpack, Blanket, Holy Water, Lamp, 7 days of Rations, Robe, and Tinderbox.
  cost: 33 GP
  weight: 29 lb.
- id: scholars-pack
  name: Scholar's Pack
  description: Backpack, Book, Ink, Ink Pen, Lamp, 10 flasks of Oil, 10 sheets of Parchment, and Tinderbox.
  cost: 40 GP
  weight: 22 lb.
- id: spellbook
  name: Spellbook
  description: Holds a Wizard's level 1+ spells; 100 pages.
- id: acid
  name: Acid
  description: When you take the Attack action, you can replace one of your attacks with throwing a
    vial of Acid. Target one creature or object you can see within 20 feet of yourself. The target
    must succeed on a Dexterity saving throw (DC 8 plus your Dexterity modifier and Proficiency
    Bonus) or take 2d6 Acid damage.
  cost: 25 GP
  weight: 1 lb.
- id: alchemists-fire
  name: Alchemist's Fire
  description: When you take the Attack action, you can replace one of your attacks with throwing a
    flask of Alchemist's Fire. Target one creature or object you can see within 20 feet of yourself.
    The target must succeed on a Dexterity saving throw (DC 8 plus your Dexterity modifier and
    Proficiency Bonus) or take 1d4 Fire damage and start burning (see "Rules Glossary").
  cost: 50 GP
  weight: 1 lb.
- id: antitoxin
  name: Antitoxin
  description: As a Bonus Action, you can drink a vial of Antitoxin to gain Advantage on saving throws
    to avoid or end the Poisoned condition for 1 hour.
  cost: 50 GP
- id: arcane-focus-rod
  name: Arcane Focus (rod)
  cost: 10 GP
  weight: 2 lb.
- id: arcane-focus-staff
  name: Arcane Focus (staff)
  cost: 5 GP
  weight: 4 lb.
- id: arcane-focus-wand
  name: Arcane Focus (wand)
  cost: 10 GP
  weight: 1 lb.
- id: backpack
  name: Backpack
  description: A Backpack holds up to 30 pounds within 1 cubic foot. It can also serve as a saddlebag.
  cost: 2 GP
  weight: 5 lb.
- id: ball-bearings
  name: Ball Bearings
  description: As a Utilize action, you can spill Ball Bearings from their pouch. They spread to cover
    a level, 10-foot-square area within 10 feet of yourself. A creature that enters this area for
    the first time on a turn must succeed on a DC 10 Dexterity saving throw or have the Prone
    condition. It takes 10 minutes to recover the Ball Bearings.
  cost: 1 GP
  weight: 2 lb.
- id: barrel
  name: Barrel
  description: A Barrel holds up to 40 gallons of liquid or up to 4 cubic feet of dry goods.
  cost: 2 GP
  weight: 70 lb.
- id: basic-poison
  name: Basic Poison
  description: As a Bonus Action, you can use a vial of Basic Poison to coat one weapon or up to three
    pieces of ammunition. A creature that takes Piercing or Slashing damage from the poisoned weapon
    or ammunition takes an extra 1d4 Poison damage. Once applied, the poison retains potency for 1
    minute or until its damage is dealt, whichever comes first.
  cost: 100 GP
- id: basket
  name: Basket
  description: A Basket holds up to 40 pounds within 2 cubic feet.
  cost: 4 SP
  weight: 2 lb.
- id: bedroll
  name: Bedroll
  description: A Bedroll sleeps one Small or Medium creature. While in a Bedroll, you automatically
    succeed on saving throws against extreme cold (see "Gameplay Toolbox").
  cost: 1 GP
  weight: 7 lb.
- id: bell
  name: Bell
  description: When rung as a Utilize action, a Bell produces a sound that can be heard up to 60 feet away.
  cost: 1 GP
- id: blanket
  name: Blanket
  description: While wrapped in a blanket, you have Advantage on saving throws against extreme cold
    (see "Gameplay Toolbox").
  cost: 5 SP
  weight: 3 lb.
- id: block-and-tackle
  name: Block and Tackle
  description: A Block and Tackle allows you to hoist up to four times the weight you can normally lift.
  cost: 1 GP
  weight: 5 lb.
- id: blowgun-needle
  name: Needle
  cost: 1 GP
  weight: 1 lb.
  bundle: 50
- id: book
  name: Book
  description: A Book contains fiction or nonfiction. If you consult an accurate nonfiction Book about
    its topic, you gain a +5 bonus to Intelligence (Arcana, History, Nature, or Religion) checks you
    make about that topic.
  cost: 25 GP
  weight: 5 lb.
- id: bucket
  name: Bucket
  description: A Bucket holds up to half a cubic foot of contents.
  cost: 5 CP
  weight: 2 lb.
- id: bullseye-lantern
  name: Bullseye Lantern
  description: A Bullseye Lantern burns Oil as fuel to cast Bright Light in a 60-foot Cone and Dim
    Light for an additional 60 feet.
  cost: 10 GP
  weight: 2 lb.
- id: caltrops
  name: Caltrops
  description: As a Utilize action, you can spread Caltrops from their bag to cover a 5-foot-square
    area within 5 feet of yourself. A creature that enters this area for the first time on a turn
    must succeed on a DC 15 Dexterity saving throw or take 1 Piercing damage and have its Speed
    reduced to 0 until the start of its next turn. It takes 10 minutes to recover the Caltrops.
  cost: 1 GP
  weight: 2 lb.
- id: candle
  name: Candle
  description: For 1 hour, a lit Candle sheds Bright Light in a 5-foot radius and Dim Light for an
    additional 5 feet.
  cost: 1 CP
- id: chain
  name: Chain
  description: As a Utilize action, you can wrap a Chain around an unwilling creature within 5 feet of
    yourself that has the Grappled, Incapacitated, or Restrained condition if you succeed on a DC 13
    Strength (Athletics) check. If the creature's legs are bound, the creature has the Restrained
    condition until it escapes. Escaping the Chain requires the creature to make a successful DC 18
    Dexterity (Acrobatics) check as an action. Bursting the Chain requires a successful DC 20
    Strength (Athletics) check as an action.
  cost: 5 GP
  weight: 10 lb.
- id: chest
  name: Chest
  description: A Chest holds up to 12 cubic feet of contents.
  cost: 5 GP
  weight: 25 lb.
- id: climbers-kit
  name: Climber's Kit
  description: A Climber's Kit includes boot tips, gloves, pitons, and a harness. As a Utilize action,
    you can use the Climber's Kit to anchor yourself; when you do, you can't fall more than 25 feet
    from the anchor point, and you can't move more than 25 feet from there without undoing the
    anchor as a Bonus Action.
  cost: 25 GP
  weight: 12 lb.
- id: component-pouch
  name: Component Pouch
  description: A Component Pouch is watertight and filled with compartments that hold all the free
    Material components of your spells.
  cost: 25 GP
  weight: 2 lb.
- id: costume
  name: Costume
  description: While wearing a Costume, you have Advantage on any ability check you make to
    impersonate the person or type of person it represents.
  cost: 5 GP
  weight: 4 lb.
- id: crossbow-bolt
  name: Bolt
  cost: 1 GP
  weight: 1½ lb.
  bundle: 20
- id: crossbow-bolt-case
  name: Crossbow Bolt Case
  description: A Crossbow Bolt Case holds up to 20 Bolts.
  cost: 1 GP
  weight: 1 lb.
- id: diplomats-pack
  name: Diplomat's Pack
  description: "A Diplomat's Pack contains the following items: Chest, Fine Clothes, Ink, 5 Ink Pens,
    Lamp, 2 Map or Scroll Cases, 4 flasks of Oil, 5 sheets of Paper, 5 sheets of Parchment, Perfume,
    and Tinderbox."
  cost: 39 GP
  weight: 39 lb.
- id: druidic-focus-sprig-of-mistletoe
  name: Druidic Focus (sprig of mistletoe)
  cost: 1 GP
- id: druidic-focus-wooden-staff
  name: Druidic Focus (wooden staff)
  cost: 5 GP
  weight: 4 lb.
- id: druidic-focus-yew-wand
  name: Druidic Focus (yew wand)
  cost: 10 GP
  weight: 1 lb.
- id: fine-clothes
  name: Fine Clothes
  description: Fine Clothes are made of expensive fabrics and adorned with expertly crafted details.
    Some events and locations admit only people wearing these clothes.
  cost: 15 GP
  weight: 6 lb.
- id: firearm-bullet
  name: Firearm Bullet
  cost: 3 GP
  weight: 2 lb.
  bundle: 10
- id: flask
  name: Flask
  description: A Flask holds up to 1 pint.
  cost: 2 CP
  weight: 1 lb.
- id: glass-bottle
  name: Glass Bottle
  description: A Glass Bottle holds up to 1½ pints.
  cost: 2 GP
  weight: 2 lb.
- id: grappling-hook
  name: Grappling Hook
  description: As a Utilize action, you can throw the Grappling Hook at a railing, a ledge, or another
    catch within 50 feet of yourself, and the hook catches on if you succeed on a DC 13 Dexterity
    (Acrobatics) check. If you tied a Rope to the hook, you can then climb it.
  cost: 2 GP
  weight: 4 lb.
- id: holy-symbol-amulet
  name: Holy Symbol (amulet)
  cost: 5 GP
  weight: 1 lb.
- id: holy-symbol-emblem
  name: Holy Symbol (emblem)
  cost: 5 GP
- id: holy-symbol-reliquary
  name: Holy Symbol (reliquary)
  cost: 5 GP
  weight: 2 lb.
- id: holy-water
  name: Holy Water
  description: When you take the Attack action, you can replace one of your attacks with throwing a
    flask of Holy Water. Target one creature you can see within 20 feet of yourself. The target must
    succeed on a Dexterity saving throw (DC 8 plus your Dexterity modifier and Proficiency Bonus) or
    take 2d8 Radiant damage if it is a Fiend or an Undead.
  cost: 25 GP
  weight: 1 lb.
- id: hooded-lantern
  name: Hooded Lantern
  description: A Hooded Lantern burns Oil as fuel to cast Bright Light in a 30-foot radius and Dim
    Light for an additional 30 feet. As a Bonus Action, you can lower the hood, reducing the light
    to Dim Light in a 5-foot radius, or raise it again.
  cost: 5 GP
  weight: 2 lb.
- id: hunting-trap
  name: Hunting Trap
  description: As a Utilize action, you can set a Hunting Trap, which is a sawtooth steel ring that
    snaps shut when a creature steps on a pressure plate in the center.
  cost: 5 GP
  weight: 25 lb.
- id: ink
  name: Ink
  description: Ink comes in a 1-ounce bottle, which provides enough ink to write about 500 pages.
  cost: 10 GP
- id: ink-pen
  name: Ink Pen
  description: Using Ink, an Ink Pen is used to write or draw.
  cost: 2 CP
- id: iron-pot
  name: Iron Pot
  description: An Iron Pot holds up to 1 gallon.
  cost: 2 GP
  weight: 10 lb.
- id: iron-spikes
  name: Iron Spikes
  description: Iron Spikes come in bundles of ten. As a Utilize action, you can use a blunt object,
    such as a Light Hammer, to hammer a spike into wood, earth, or a similar material. You can do so
    to jam a door shut or to then tie a Rope or Chain to the Spike.
  cost: 1 GP
  weight: 5 lb.
- id: jug
  name: Jug
  description: A Jug holds up to 1 gallon.
  cost: 2 CP
  weight: 4 lb.
- id: ladder
  name: Ladder
  description: A Ladder is 10 feet tall. You must climb to move up or down it.
  cost: 1 SP
  weight: 25 lb.
- id: lamp
  name: Lamp
  description: A Lamp burns Oil as fuel to cast Bright Light in a 15-foot radius and Dim Light for an
    additional 30 feet.
  cost: 5 SP
  weight: 1 lb.
- id: lock
  name: Lock
  description: A Lock comes with a key. Without the key, a creature can use Thieves' Tools to pick
    this Lock with a successful DC 15 Dexterity (Sleight of Hand) check.
  cost: 10 GP
  weight: 1 lb.
- id: magnifying-glass
  name: Magnifying Glass
  description: A Magnifying Glass grants Advantage on any ability check made to appraise or inspect a
    highly detailed item. Lighting a fire with a Magnifying Glass requires light as bright as
    sunlight to focus, tinder to ignite, and about 5 minutes for the fire to ignite.
  cost: 100 GP
- id: manacles
  name: Manacles
  description: As a Utilize action, you can use Manacles to bind an unwilling Small or Medium creature
    within 5 feet of yourself that has the Grappled, Incapacitated, or Restrained condition if you
    succeed on a DC 13 Dexterity (Sleight of Hand) check. While bound, a creature has Disadvantage
    on attack rolls, and the creature is Restrained if the Manacles are attached to a chain or hook
    that is fixed in place. Escaping the Manacles requires a successful DC 20 Dexterity (Sleight of
    Hand) check as an action. Bursting them requires a successful DC 25 Strength (Athletics) check
    as an action.
  cost: 2 GP
  weight: 6 lb.
- id: map
  name: Map
  description: If you consult an accurate Map, you gain a +5 bonus to Wisdom (Survival) checks you
    make to find your way in the place represented on it.
  cost: 1 GP
- id: map-or-scroll-case
  name: Map or Scroll Case
  description: A Map or Scroll Case holds up to 10 sheets of paper or 5 sheets of parchment.
  cost: 1 GP
  weight: 1 lb.
- id: mirror
  name: Mirror
  description: A handheld steel Mirror is useful for personal cosmetics but also for peeking around
    corners and reflecting light as a signal.
  cost: 5 GP
  weight: 1/2 lb.
- id: net
  name: Net
  description: When you take the Attack action, you can replace one of your attacks with throwing a
    Net. Target a creature you can see within 15 feet of yourself. The target must succeed on a
    Dexterity saving throw (DC 8 plus your Dexterity modifier and Proficiency Bonus) or have the
    Restrained condition until it escapes. The target succeeds automatically if it is Huge or
    larger.
  cost: 1 GP
  weight: 3 lb.
- id: oil
  name: Oil
  description: You can douse a creature, object, or space with Oil or use it as fuel, as detailed below.
  cost: 1 SP
  weight: 1 lb.
- id: paper
  name: Paper
  description: One sheet of Paper can hold about 250 handwritten words.
  cost: 2 SP
- id: perfume
  name: Perfume
  description: Perfume comes in a 4-ounce vial. For 1 hour after applying Perfume to yourself, you
    have Advantage on Charisma (Persuasion) checks made to influence an Indifferent Humanoid within
    5 feet of yourself.
  cost: 5 GP
- id: pole
  name: Pole
  description: A Pole is 10 feet long. You can use it to touch something up to 10 feet away. If you
    must make a Strength (Athletics) check as part of a High or Long Jump, you can use the Pole to
    vault, giving yourself Advantage on the check.
  cost: 5 CP
  weight: 7 lb.
- id: portable-ram
  name: Portable Ram
  description: You can use a Portable Ram to break down doors. When doing so, you gain a +4 bonus to
    the Strength check. One other character can help you use the ram, giving you Advantage on this
    check.
  cost: 4 GP
  weight: 35 lb.
- id: rations
  name: Rations
  description: Rations consist of travel-ready food, including jerky, dried fruit, hardtack, and nuts.
    See "Malnutrition" in "Rules Glossary" for the risks of not eating.
  cost: 5 SP
  weight: 2 lb.
- id: rope
  name: Rope
  description: As a Utilize action, you can tie a knot with Rope if you succeed on a DC 10 Dexterity
    (Sleight of Hand) check. The Rope can be burst with a successful DC 20 Strength (Athletics)
    check.
  cost: 1 GP
  weight: 5 lb.
- id: sack
  name: Sack
  description: A Sack holds up to 30 pounds within 1 cubic foot.
  cost: 1 CP
  weight: 1/2 lb.
- id: shovel
  name: Shovel
  description: Working for 1 hour, you can use a Shovel to dig a hole that is 5 feet on each side in
    soil or similar material.
  cost: 2 GP
  weight: 5 lb.
- id: signal-whistle
  name: Signal Whistle
  description: When blown as a Utilize action, a Signal Whistle produces a sound that can be heard up
    to 600 feet away.
  cost: 5 CP
- id: sling-bullet
  name: Sling Bullet
  cost: 4 CP
  weight: 1½ lb.
  bundle: 20
- id: spyglass
  name: Spyglass
  description: Objects viewed through a Spyglass are magnified to twice their size.
  cost: 1,000 GP
  weight: 1 lb.
- id: string
  name: String
  description: String is 10 feet long. You can tie a knot in it as a Utilize action.
  cost: 1 SP
- id: tent
  name: Tent
  description: A Tent sleeps up to two Small or Medium creatures.
  cost: 2 GP
  weight: 20 lb.
- id: tinderbox
  name: Tinderbox
  description: A Tinderbox is a small container holding flint, fire steel, and tinder (usually dry
    cloth soaked in light oil) used to kindle a fire. Using it to light a Candle, Lamp, Lantern, or
    Torch—or anything else with exposed fuel—takes a Bonus Action. Lighting any other fire takes 1
    minute.
  cost: 5 SP
  weight: 1 lb.
- id: torch
  name: Torch
  description: A Torch burns for 1 hour, casting Bright Light in a 20-foot radius and Dim Light for an
    additional 20 feet. When you take the Attack action, you can attack with the Torch, using it as
    a Simple Melee weapon. On a hit, the target takes 1 Fire damage.
  cost: 1 CP
  weight: 1 lb.
- id: vial
  name: Vial
  description: A Vial holds up to 4 ounces.
  cost: 1 GP
- id: waterskin
  name: Waterskin
  description: A Waterskin holds up to 4 pints. If you don't drink sufficient water, you risk
    dehydration (see "Rules Glossary").
  cost: 2 SP
  weight: 5 lb. (full)
