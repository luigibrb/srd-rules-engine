# SRD 5.2.1 — "Feats". Only Origin and Fighting Style feats are needed at level 1.
- id: alert
  name: Alert
  category: origin
  description: >-
    Initiative Proficiency: add your Proficiency Bonus to Initiative. Initiative Swap: after
    rolling Initiative, swap it with a willing ally's (neither can be Incapacitated).
  grants:
    effects: [{target: initiative, value: prof}]

- id: magic-initiate
  name: Magic Initiate
  category: origin
  repeatable: true
  repeat_requires_different: spell_list
  description: >-
    Learn two cantrips and one level 1 spell from the Cleric, Druid, or Wizard list. You can
    cast the level 1 spell once per Long Rest without a slot. Repeatable with a different list.
  unsupported: Cantrip and level 1 spell selection is not automated yet — note them by hand.
  grants:
    choices:
      - id: spell_list
        label: Magic Initiate spell list
        kind: option
        step: features
        options:
          - {id: cleric, name: Cleric}
          - {id: druid, name: Druid}
          - {id: wizard, name: Wizard}
      - id: spellcasting_ability
        label: Magic Initiate spellcasting ability
        kind: ability
        step: features
        allowed: [int, wis, cha]

- id: savage-attacker
  name: Savage Attacker
  category: origin
  description: >-
    Once per turn when you hit a target with a weapon, roll the weapon's damage dice twice
    and use either roll.

- id: skilled
  name: Skilled
  category: origin
  repeatable: true
  description: Gain proficiency in any combination of three skills or tools of your choice.
  grants:
    choices:
      - id: proficiencies
        label: Skilled proficiencies
        kind: skill_or_tool
        count: 3

- id: archery
  name: Archery
  category: fighting_style
  description: +2 bonus to attack rolls you make with Ranged weapons.
  grants:
    effects: [{target: attack.ranged, value: 2}]

- id: defense
  name: Defense
  category: fighting_style
  description: While wearing Light, Medium, or Heavy armor, +1 bonus to Armor Class.
  grants:
    effects: [{target: ac, value: 1, when: wearing_armor}]

- id: great-weapon-fighting
  name: Great Weapon Fighting
  category: fighting_style
  description: >-
    When you roll damage for a Melee attack with a weapon held in two hands (Two-Handed or
    Versatile), treat any 1 or 2 on a damage die as a 3.

- id: two-weapon-fighting
  name: Two-Weapon Fighting
  category: fighting_style
  description: >-
    When you make the extra attack from the Light property, add your ability modifier to its
    damage if you aren't already.
