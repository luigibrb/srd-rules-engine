        max_spell_level: 5
        tag: wizard-spellbook
    '10':
      traits:
      - name: Empowered Evocation
        text: Whenever you cast a Wizard spell from the Evocation school, you can add your Intelligence
          modifier to one damage roll of that spell.
    '11':
      choices:
      - id: evocation_savant
        label: Evocation Savant (free evocation spell)
        kind: spell
        spell_list: wizard
        school: evocation
        max_spell_level: 6
