# SRD 5.2.1 — "Character Origins" > "Character Backgrounds".
- id: acolyte
  name: Acolyte
  description: You devoted yourself to service in a temple.
  ability_scores: [int, wis, cha]
  grants:
    feats: [{feat: magic-initiate, params: {spell_list: cleric}}]
    skills: [insight, religion]
    tools: [calligraphers-supplies]
    choices:
      - id: equipment
        label: Acolyte equipment
        kind: option
        step: equipment
        options:
          - id: a
            name: Package
            description: Calligrapher's Supplies, Book (prayers), Holy Symbol, Parchment (10), Robe, 8 GP
            grants:
              items:
                - {item: calligraphers-supplies}
                - {item: book-prayers}
                - {item: holy-symbol}
                - {item: parchment, qty: 10}
                - {item: robe}
              gp: 8
          - {id: b, name: Gold, description: 50 GP, grants: {gp: 50}}

- id: criminal
  name: Criminal
  description: You scraped by in dark alleys as a cutpurse or burglar.
  ability_scores: [dex, con, int]
  grants:
    feats: [{feat: alert}]
    skills: [sleight-of-hand, stealth]
    tools: [thieves-tools]
    choices:
      - id: equipment
        label: Criminal equipment
        kind: option
        step: equipment
        options:
          - id: a
            name: Package
            description: 2 Daggers, Thieves' Tools, Crowbar, 2 Pouches, Traveler's Clothes, 16 GP
            grants:
              items:
                - {item: dagger, qty: 2}
                - {item: thieves-tools}
                - {item: crowbar}
                - {item: pouch, qty: 2}
                - {item: travelers-clothes}
              gp: 16
          - {id: b, name: Gold, description: 50 GP, grants: {gp: 50}}

- id: sage
  name: Sage
  description: You spent formative years in libraries, studying lore.
  ability_scores: [con, int, wis]
  grants:
    feats: [{feat: magic-initiate, params: {spell_list: wizard}}]
    skills: [arcana, history]
    tools: [calligraphers-supplies]
    choices:
      - id: equipment
        label: Sage equipment
        kind: option
        step: equipment
        options:
          - id: a
            name: Package
            description: Quarterstaff, Calligrapher's Supplies, Book (history), Parchment (8), Robe, 8 GP
            grants:
              items:
                - {item: quarterstaff}
                - {item: calligraphers-supplies}
                - {item: book-history}
                - {item: parchment, qty: 8}
                - {item: robe}
              gp: 8
          - {id: b, name: Gold, description: 50 GP, grants: {gp: 50}}

- id: soldier
  name: Soldier
  description: You trained for war from a young age.
  ability_scores: [str, dex, con]
  grants:
    feats: [{feat: savage-attacker}]
    skills: [athletics, intimidation]
    choices:
      - id: tool
        label: Soldier gaming set
        kind: tool
        category: gaming-set
      - id: equipment
        label: Soldier equipment
        kind: option
        step: equipment
        options:
          - id: a
            name: Package
            description: >-
              Spear, Shortbow, 20 Arrows, Gaming Set (same as your tool), Healer's Kit,
              Quiver, Traveler's Clothes, 14 GP
            grants:
              items:
                - {item: spear}
                - {item: shortbow}
                - {item: arrow, qty: 20}
                - {item: gaming-set}
                - {item: healers-kit}
                - {item: quiver}
                - {item: travelers-clothes}
              gp: 14
          - {id: b, name: Gold, description: 50 GP, grants: {gp: 50}}
